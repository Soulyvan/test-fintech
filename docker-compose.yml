services:
  db:
    image: postgres:15
    container_name: fintech_postgres
    restart: always
    environment:
      POSTGRES_DB: fintech
      POSTGRES_USER: fintech_user
      POSTGRES_PASSWORD: fintech_pass
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: